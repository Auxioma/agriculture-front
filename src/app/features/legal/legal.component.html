<section class="px-4 py-8 lg:px-16 lg:py-14">
  <div class="mx-auto max-w-[50rem]">
    @if (page(); as legal) {
      <h1 class="text-xl font-bold lg:text-4xl">{{ legal.title }}</h1>

      <div class="mt-6 lg:mt-8">
        @for (block of blocks(); track $index) {
          @if (block.heading) {
            <h2 class="mt-6 text-xs font-bold uppercase tracking-wide text-agri first:mt-0">{{ block.text }}</h2>
          } @else {
            <p class="mt-2 text-sm text-grey-700">{{ block.text }}</p>
          }
        }
      </div>
    } @else if (page() === null) {
      <h1 class="text-xl font-bold lg:text-4xl">Page introuvable</h1>
      <p class="mt-3 text-sm text-grey-700">Cette page n'est pas encore disponible.</p>
    }
  </div>
</section>
