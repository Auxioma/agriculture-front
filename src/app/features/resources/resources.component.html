<section class="px-4 py-8 lg:px-16 lg:py-14">
  <div class="mx-auto max-w-[68rem]">
    <h1 class="text-xl font-bold lg:text-center lg:text-4xl">Blog &amp; ressources</h1>

    <div class="mt-6 grid grid-cols-1 gap-5 lg:mt-12 lg:grid-cols-3 lg:items-start lg:gap-10">
      @for (article of articles; track article.title) {
        <article class="overflow-hidden rounded-xl border border-grey-200 bg-white">
          <img [src]="article.image" [alt]="article.alt" loading="lazy" class="h-28 w-full object-cover lg:h-44" />
          <div class="p-4 lg:p-5">
            <span class="inline-block rounded-full bg-badge-bg px-3 py-1 text-xs font-semibold text-agri">
              {{ article.tag }}
            </span>
            <h2 class="mt-3 font-bold">{{ article.title }}</h2>
            <p class="mt-2 text-sm text-grey-700">{{ article.excerpt }}</p>
            <p class="mt-3 text-xs text-secondary">{{ article.date }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
