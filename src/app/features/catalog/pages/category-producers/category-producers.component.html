<section class="mx-auto w-full max-w-7xl px-4 py-6 md:px-16 md:py-8">
  <!-- Fil d'Ariane -->
  <nav aria-label="Fil d'Ariane" class="text-sm">
    <ol class="flex flex-wrap items-center gap-2">
      <li><a routerLink="/" class="text-fonts hover:text-grey-700">Accueil</a></li>
      <li aria-hidden="true" class="text-fonts">/</li>
      <li><a routerLink="/categories" class="text-fonts hover:text-grey-700">Catégories</a></li>
      @if (category(); as cat) {
        <li aria-hidden="true" class="text-fonts">/</li>
        <li aria-current="page" class="text-agri">{{ cat.name }}</li>
      }
    </ol>
  </nav>

  <h1 class="mt-3 text-3xl font-bold text-fonts md:text-2xl">Producteurs</h1>

  @if (categoryNotFound()) {
    <p role="alert" class="mt-5 rounded-lg border border-danger p-4 text-danger">
      Cette catégorie n'existe pas.
      <a routerLink="/categories" class="font-semibold underline">Retour aux catégories</a>
    </p>
  } @else {
    <!-- categoryId undefined tant que la catégorie n'est pas chargée : la liste attend -->
    <app-producer-list
      [categoryId]="category()?.id"
      [categorySlug]="category()?.slug ?? null"
      [categoryName]="category()?.name ?? null"
    />
  }
</section>
