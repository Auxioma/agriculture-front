<section class="px-4 py-8 lg:px-16 lg:py-14">
  <div class="mx-auto max-w-2xl">
    <div class="lg:text-center">
      <h1 class="text-xl font-bold lg:text-4xl">Contactez-nous</h1>
      <p class="mt-3 text-sm text-grey-700 lg:mx-auto lg:max-w-xl">
        Une question, un problème ou une suggestion ? Notre équipe vous répond sous 24h ouvrées.
      </p>
    </div>

    <form class="mt-8 space-y-4 lg:mt-10" (submit)="$event.preventDefault()">
      @for (field of fields; track field.id) {
        <div>
          <label [for]="'contact-' + field.id" class="mb-1 block text-xs font-semibold text-grey-700">
            {{ field.label }}
          </label>
          <input
            [id]="'contact-' + field.id"
            [name]="field.id"
            [type]="field.type"
            [attr.autocomplete]="field.autocomplete"
            [placeholder]="field.placeholder"
            required
            class="w-full rounded-lg border border-grey-400 px-3 py-2 text-sm outline-none placeholder:text-grey-500 focus:border-agri"
          />
        </div>
      }

      <div>
        <label for="contact-message" class="mb-1 block text-xs font-semibold text-grey-700">Message</label>
        <textarea
          id="contact-message"
          name="message"
          rows="4"
          required
          placeholder="Écrivez votre message ici..."
          class="w-full rounded-lg border border-grey-400 px-3 py-2 text-sm outline-none placeholder:text-grey-500 focus:border-agri"
        ></textarea>
      </div>

      <button
        type="submit"
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-agri px-5 py-3 text-sm font-semibold text-white lg:w-fit"
      >
        Envoyer le message
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <ul class="mt-8 space-y-4">
      <li class="flex items-center gap-3">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-badge-bg text-agri">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <polyline points="3 7 12 13 21 7"></polyline>
          </svg>
        </span>
        <div>
          <a href="mailto:contact@trouvemoi-agri.com" class="text-sm font-bold">contact@trouvemoi-agri.com</a>
          <p class="text-xs text-grey-700">Réponse sous 24h ouvrées</p>
        </div>
      </li>
      <li class="flex items-center gap-3">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-badge-bg text-agri">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </span>
        <div>
          <p class="text-sm font-bold">Lyon, France</p>
          <p class="text-xs text-grey-700">Siège social TrouveMoi Agri</p>
        </div>
      </li>
    </ul>
  </div>
</section>
